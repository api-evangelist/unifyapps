aid: unifyapps
name: UnifyApps
description: >-
  UnifyApps is an enterprise "AI Operating System" founded in 2023 by Ragy
  Thomas (founder of Sprinklr) and Pavitar Singh: one platform to build and
  manage agentic AI solutions, create no-code enterprise applications,
  automate complex business processes, and replicate data in real time across
  1,000+ application integrations, deployable in the cloud or on-premises.
  Customers expose workflows as REST endpoints (Callable, Webhook, LLM,
  External API, and Event Stream resources) through the platform's API
  Manager, and can publish MCP servers whose tools draw on 600+ connectors,
  custom in-house APIs, and workflows — secured with JWT, OAuth 2.0, Basic, or
  custom authentication plus rate limiting, quotas, and analytics. UnifyApps
  has raised $84M+ (Series A led by ICONIQ Growth; $50M Series B led by
  WestBridge Capital) and is headquartered in New York with offices in
  Gurugram, Dubai, and Hyderabad.
