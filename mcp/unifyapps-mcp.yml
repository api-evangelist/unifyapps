summary: >-
  UnifyApps does not publish a single public first-party MCP server for its own
  API. Instead, MCP servers are a documented product capability of the Unify
  Agentic AI module: customers create and host MCP servers on the platform,
  exposing any of the 600+ out-of-the-box connectors, custom in-house APIs
  connected to the platform, or entire workflows (or individual workflow nodes)
  as MCP-compliant tools. Created MCP servers are published through the
  platform's API Manager with customizable RESTful endpoint URLs.
